apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-anomalies-config
  namespace: default
  labels:
    app: mlops-anomalies
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "2"
  LOG_LEVEL: "info"
  MODEL_PATH: "/app/models/isolation_forest_model.joblib"
  SCALER_PATH: "/app/data/processed/scaler.joblib"
  MLFLOW_TRACKING_URI: "sqlite:///app/mlruns/mlflow.db"
