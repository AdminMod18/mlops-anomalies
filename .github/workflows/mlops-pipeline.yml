name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  PYTHON_VERSION: '3.10'
  DOCKER_IMAGE: adminmod18/mlops-anomalies

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ------------------------------
  # LINT
  # ------------------------------
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install linters
        run: pip install flake8 black isort
      - name: Run linters
        run: |
          black --check src/ api/ || true
          flake8 src/ api/ --max-line-length=120 --ignore=E501,W503 || true

  # ------------------------------
  # UNIT TESTS
  # ------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      - name: Create directories
        run: mkdir -p data/raw data/processed models mlruns plots logs
      - name: Generate test data
        run: python -c "from src.utils import generate_synthetic_data; generate_synthetic_data('data/raw/anomaly_data.csv', n_samples=1000)"
      - name: Run preprocessing
        run: python src/preprocess.py
      - name: Run training
        run: python src/train.py
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=api --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ------------------------------
  # TRAIN MODEL
  # ------------------------------
  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: test
    outputs:
      model_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare dirs
        run: mkdir -p data/raw data/processed models mlruns plots logs config

      - name: Auto-increment version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_TAG=${LATEST_TAG#v}
          IFS='.' read -ra VERSION <<< "$LATEST_TAG"
          MAJOR=${VERSION[0]:-0}
          MINOR=${VERSION[1]:-0}
          PATCH=${VERSION[2]:-0}
          PATCH=$((PATCH + 1))
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Train model
        run: |
          python -c "from src.utils import generate_synthetic_data; generate_synthetic_data('data/raw/anomaly_data.csv', n_samples=10000)"
          python src/preprocess.py
          python src/train.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ steps.version.outputs.version }}
          path: |
            models/
            data/processed/scaler.joblib
            metrics.json
          retention-days: 30

  # ------------------------------
  # BUILD & PUSH DOCKER IMAGE
  # ------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ needs.train.outputs.model_version }}
          path: ./

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.train.outputs.model_version }}
            ${{ env.DOCKER_IMAGE }}:latest

  # ------------------------------
  # DEPLOY VALIDATION (KIND)
  # ------------------------------
  deploy:
    name: Deploy to Kubernetes (Ephemeral CI Cluster)
    runs-on: ubuntu-latest
    needs: [build, train]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create KIND cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: mlops-ci
          version: v1.30.0

      - name: Update image tag in manifest
        run: |
          sed -i 's|image: adminmod18/mlops-anomalies:.*|image: adminmod18/mlops-anomalies:${{ needs.train.outputs.model_version }}|g' kubernetes/deployment.yaml

      - name: Validate manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/configmap.yaml
          kubectl apply --dry-run=client -f kubernetes/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/service.yaml

      - name: Apply manifests (test deploy)
        run: kubectl apply -f kubernetes/

  # ------------------------------
  # RELEASE
  # ------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy, train]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ needs.train.outputs.model_version }}
          path: release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.train.outputs.model_version }}
          name: Release v${{ needs.train.outputs.model_version }}
          body: |
            ## MLOps Anomaly Detection v${{ needs.train.outputs.model_version }}

            ### Docker Image
            ```
            docker pull ${{ env.DOCKER_IMAGE }}:${{ needs.train.outputs.model_version }}
            ```
          files: release-artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}