version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: adminmod18/mlops-anomalies:latest
    container_name: mlops-anomalies-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/isolation_forest_model.joblib
      - SCALER_PATH=/app/data/processed/scaler.joblib
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=info
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    depends_on:
      - mlflow

  mlflow:
    image: python:3.10-slim
    container_name: mlops-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:///mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - mlops-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: mlops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./kubernetes/prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mlops-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: mlops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
